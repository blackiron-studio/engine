[package]
name = "kiln_kernel"
version = "0.8.0"
edition = "2021"
description = "Kiln's compiled kernel: sprite batching, node tables, particles, audio, physics and the wgpu renderer behind a C ABI, for native hosts and WebAssembly."
license = "MIT"
repository = "https://github.com/blackiron-studio/engine"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# 2D physics through rapier; on the web this is loaded as a separate module only when a game uses it.
physics = ["dep:rapier2d"]
physics3d = ["dep:rapier3d", "dep:serde_json"]
# The wgpu renderer for native hosts; the web keeps its WebGL2 renderer.
render = ["dep:wgpu", "dep:raw-window-handle", "dep:bytemuck", "dep:pollster", "dep:log", "dep:serde", "dep:serde_json"]
# Streaming music decoders (OGG Vorbis, MP3, FLAC, WAV, AAC in MP4); the web loads this as audio.wasm.
codecs = ["dep:symphonia"]

[dependencies]
rapier3d = { version = "0.22", optional = true, default-features = false, features = ["dim3", "f32"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rapier2d = { version = "0.22", optional = true, default-features = false, features = ["dim2", "f32"] }
symphonia = { version = "0.5", optional = true, default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "flac", "pcm", "isomp4", "aac"] }
wgpu = { version = "24", optional = true }
raw-window-handle = { version = "0.6", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
log = { version = "0.4", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
